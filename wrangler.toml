# Cloudflare Pages configuration
name = "gachiroun-homepage"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Environment variables for local development (wrangler dev)
[vars]
STRAPI_URL = "http://localhost:1337"
PUBLIC_GA_ID = "GTM-MVL6P7N7"
PUBLIC_RECAPTCHA_SITE_KEY = "test-key"

# Secrets should be set via: wrangler secret put <SECRET_NAME>
# For local dev, use .dev.vars file instead (see .dev.vars.example)

# Production environment (deployed to Cloudflare Pages)
[env.production]
# These will be overridden by Cloudflare Pages dashboard settings

# KV Namespaces (if needed in future)
# [[kv_namespaces]]
# binding = "MY_KV"
# id = "your-kv-namespace-id"
# preview_id = "your-preview-kv-namespace-id"
